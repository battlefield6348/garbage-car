<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.css"><link rel="stylesheet" href="./styles.css"><title>Garbage Car</title></head><body>
<header class="topbar"><div><strong>Garbage Car</strong><span>多點路線導航</span></div><div class="actions"><button id="exportBtn" class="ghost">匯出</button><label class="button ghost">匯入<input id="importInput" type="file" accept="application/json" hidden></label><button id="newRouteBtn">＋ 路線</button></div></header>
<main class="layout"><aside class="routes-panel"><div class="panel-title"><h2>我的路線</h2><span id="routeCount"></span></div><div id="routeList" class="route-list"></div></aside><section class="editor"><div id="emptyState" class="empty-state"><h1>建立第一條路線</h1><p>直接點地圖加入停靠點，導航時會依 GPS 接近站點自動切換下一站。</p><button id="emptyNewRouteBtn">建立路線</button></div>
<div id="editorContent" hidden><div class="editor-head"><div><input id="routeName" class="route-name" maxlength="100"><p id="routeMeta" class="muted"></p></div><button id="deleteRouteBtn" class="danger ghost">刪除</button></div><div class="mobile-tabs"><button class="tab active" data-tab="map">地圖</button><button class="tab" data-tab="queue">路線隊列 <span id="waypointCountTab"></span></button></div>
<div class="workspace"><div class="map-pane"><div id="map"></div><div id="navPanel" class="nav-panel" hidden><span id="navProgress"></span><strong id="navTarget"></strong><span id="navDistance"></span><div><button id="skipBtn" class="ghost">跳過此站</button><button id="stopNavBtn" class="danger ghost">結束導航</button></div></div><div id="selectionCard" class="selection-card" hidden><div><strong id="selectedName"></strong><span id="selectedAddress"></span></div><button id="addSelectedBtn">＋ 加入路線</button></div></div>
<div class="waypoint-column"><div class="section-head"><h3>路線隊列</h3><span id="waypointCount"></span></div><div class="nav-actions"><button id="startNavBtn">開始導航</button></div><p class="muted compact">接近站點 30 公尺內會自動完成並切換下一站。</p><ol id="waypointList" class="waypoint-list"></ol></div></div></div></section></main>
<template id="routeTemplate"><button class="route-card"><strong></strong><span></span></button></template><template id="waypointTemplate"><li class="waypoint"><div class="waypoint-index"></div><div class="waypoint-info"><strong></strong><span class="address"></span></div><div class="waypoint-actions"><button data-action="google" class="icon-btn">Google Maps</button><button data-action="up" class="icon-btn">↑</button><button data-action="down" class="icon-btn">↓</button><button data-action="delete" class="icon-btn danger">×</button></div></li></template>
<script src="https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.js"></script><script src="./app.js" defer></script></body></html>
