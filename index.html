<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"><title>Garbage Car</title></head><body>
<header class="topbar"><div><strong>Garbage Car</strong><span>多點路線規劃器</span></div><div class="actions"><button id="settingsBtn" class="ghost">地圖設定</button><button id="exportBtn" class="ghost">匯出</button><label class="button ghost">匯入<input id="importInput" type="file" accept="application/json" hidden></label><button id="newRouteBtn">＋ 路線</button></div></header>
<main class="layout"><aside class="routes-panel"><div class="panel-title"><h2>我的路線</h2><span id="routeCount"></span></div><div id="routeList" class="route-list"></div></aside><section class="editor">
<div id="emptyState" class="empty-state"><h1>建立第一條路線</h1><p>搜尋或直接點地圖加入停靠點，再逐站開啟 Google Maps 導航。</p><button id="emptyNewRouteBtn">建立路線</button></div>
<div id="editorContent" hidden><div class="editor-head"><div><input id="routeName" class="route-name" maxlength="100"><p id="routeMeta" class="muted"></p></div><button id="deleteRouteBtn" class="danger ghost">刪除</button></div>
<div class="mobile-tabs"><button class="tab active" data-tab="map">地圖</button><button class="tab" data-tab="queue">路線隊列 <span id="waypointCountTab"></span></button></div>
<div class="workspace"><div class="map-pane"><div id="mapSetup" class="map-setup"><h2>啟用 Google 地圖</h2><p>API Key 只保存在這台裝置，不寫入 GitHub。</p><button id="setupKeyBtn">設定 API Key</button></div><div id="map" hidden></div><div id="searchContainer" class="search-container" hidden></div><button id="locateBtn" class="locate-btn" hidden title="回到我的位置" aria-label="回到我的位置">◎</button><div id="selectionCard" class="selection-card" hidden><div><strong id="selectedName"></strong><span id="selectedAddress"></span></div><button id="addSelectedBtn">＋ 加入路線</button></div></div>
<div class="waypoint-column"><div class="section-head"><h3>路線隊列</h3><span id="waypointCount"></span></div><p class="muted compact">使用 ↑ ↓ 在手機調整順序。</p><ol id="waypointList" class="waypoint-list"></ol></div></div></div></section></main>
<dialog id="settingsDialog"><form method="dialog" class="settings-form"><h2>Google Maps 設定</h2><p>請使用已限制網站來源與 API 權限的瀏覽器 API Key。</p><label>API Key<input id="apiKeyInput" type="password" autocomplete="off" placeholder="AIza..."></label><div class="dialog-actions"><button value="cancel" class="ghost">取消</button><button id="saveKeyBtn" value="default">儲存並載入</button></div><button id="clearKeyBtn" type="button" class="danger ghost">清除 Key</button></form></dialog>
<template id="routeTemplate"><button class="route-card"><strong></strong><span></span></button></template><template id="waypointTemplate"><li class="waypoint"><div class="waypoint-index"></div><div class="waypoint-info"><strong></strong><span class="address"></span></div><div class="waypoint-actions"><button data-action="nav" class="icon-btn">導航</button><button data-action="up" class="icon-btn">↑</button><button data-action="down" class="icon-btn">↓</button><button data-action="delete" class="icon-btn danger">×</button></div></li></template><script src="./app.js" defer></script></body></html>
